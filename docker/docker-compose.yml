#version: '3.8'

services:
  db:
    image: postgres:16
    container_name: react-java-db
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=users
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  db-data:
